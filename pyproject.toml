[project]
name = "hello_api"
version = "0.1.0"
description = "A small FastAPI app that says hello and goodbye."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["fastapi (>=0.162.2,<0.163.0)", "uvicorn (>=0.54.0,<0.55.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
